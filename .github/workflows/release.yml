name: Release
run-name: Release ${{ inputs.releaseTag }}

on:
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Tag matching the committed version (e.g., v0.4.1)'
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        type: boolean
        default: false
      generateNotes:
        description: Generate GitHub release notes with the configured LLM (falls back to committed changelog)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.releaseTag }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      releaseTag: ${{ inputs.releaseTag }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.releaseTag }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: plugins
          path: build/distributions

      - name: Verify release assets and prepare fallback notes
        run: |
          python3 scripts/release.py check --tag "$RELEASE_TAG"
          python3 scripts/release.py verify-artifacts build/distributions
          (cd build/distributions && sha256sum --check SHA256SUMS)
          python3 scripts/release.py notes > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-python@v6
        if: inputs.generateNotes
        with:
          python-version: '3.12'
          cache: pip

      - name: Generate release notes with LLM
        id: llm
        if: inputs.generateNotes
        continue-on-error: true
        timeout-minutes: 3
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_TEMPERATURE: ${{ secrets.LLM_TEMPERATURE }}
          LLM_MAX_TOKENS: ${{ secrets.LLM_MAX_TOKENS }}
        run: |
          python3 -m pip install -r requirements.txt
          cp CHANGELOG.md "$RUNNER_TEMP/generated-changelog.md"
          python3 .github/workflows/script/generate_changelog.py \
            --new-tag "$RELEASE_TAG" \
            --instruct .github/workflows/script/changelog_instruct.txt \
            --changelog "$RUNNER_TEMP/generated-changelog.md"
          python3 scripts/release.py notes --changelog "$RUNNER_TEMP/generated-changelog.md" \
            > "$RUNNER_TEMP/generated-notes.md"
          mv "$RUNNER_TEMP/generated-notes.md" "$RUNNER_TEMP/release-notes.md"

      - name: Report LLM fallback
        if: inputs.generateNotes && steps.llm.outcome == 'failure'
        run: echo '::warning::LLM note generation failed; using the reviewed, committed changelog.'

      - name: Append installation instructions
        run: |
          cat >> "$RUNNER_TEMP/release-notes.md" <<'NOTES'

          ### Installation
          - IntelliJ IDEA: Settings → Plugins → gear menu → Install Plugin from Disk, then select the ZIP.
          - VS Code: Extensions → … → Install from VSIX, then select the VSIX.
          - Verify downloads with `sha256sum --check SHA256SUMS`.
          NOTES
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest both plugin packages
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            build/distributions/*.zip
            build/distributions/*.vsix

      # Tag after builds and checks succeed. A retry may reuse a tag at this
      # exact commit and update a draft, never an existing public release.
      - name: Create tag and publish complete release
        env:
          GIT_AUTHOR_NAME: Codex
          GIT_AUTHOR_EMAIL: codex@openai.com
          GIT_COMMITTER_NAME: Codex
          GIT_COMMITTER_EMAIL: codex@openai.com
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" build/distributions/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
